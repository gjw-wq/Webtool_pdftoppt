<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PDF2PPT · 智能文档转换工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // 主题在首屏前应用，避免闪白
    (function () {
      try {
        var urlTheme = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('pdf2ppt-theme');
        var theme = (urlTheme === 'dark' || urlTheme === 'light')
          ? urlTheme
          : (saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        document.documentElement.dataset.theme = theme;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div class="app-shell">

    <!-- ============ 顶栏 ============ -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="3" y="5" width="15" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/>
            <path d="M7.5 11h6M7.5 15h6M7.5 19h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M18.5 22.5h9.5M23.5 18.5v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="17" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>PDF2PPT</strong>
          <span>智能文档转换工作台</span>
        </div>
      </div>

      <div class="topbar-right">
        <span class="status-chip" id="statusChip"><i class="dot"></i><span id="statusText">就绪</span></span>
        <a class="text-link" href="https://mineru.net/apiManage/token" target="_blank" rel="noopener">获取 Token</a>
        <button class="icon-btn" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ 主体 ============ -->
    <main class="workspace">

      <!-- 左侧控制台 -->
      <aside class="panel">
        <div class="panel-scroll">

          <section class="step">
            <div class="step-head"><span class="step-no">01</span><h2>上传文档</h2></div>
            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入 PDF 文件">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 30H9a5 5 0 0 1-1-9.9A11 11 0 0 1 29 17a8 8 0 0 1 5 14h-5"/>
                <path d="M24 38V23M18.5 28.5 24 23l5.5 5.5"/>
              </svg>
              <p class="dz-title">拖入 PDF 文件</p>
              <p class="dz-sub">或点击此处选择 · 单文件最大 100 MB</p>
            </div>
            <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
            <div class="file-card" id="fileCard" hidden>
              <div class="file-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
                </svg>
              </div>
              <div class="file-meta"><strong id="fileName">—</strong><span id="fileSize">—</span></div>
              <button class="mini-btn" id="clearFile" type="button" aria-label="移除文件">×</button>
            </div>
          </section>

          <section class="step">
            <div class="step-head"><span class="step-no">02</span><h2>转换设置</h2></div>

            <label class="field-label" for="tokenInput">MinerU Token <span class="req">*</span></label>
            <div class="input-wrap">
              <input id="tokenInput" type="password" placeholder="填写 Token，或使用 config.py 中的配置" autocomplete="off" spellcheck="false">
              <button class="input-suffix" id="toggleToken" type="button" aria-label="显示或隐藏 Token">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>
                </svg>
              </button>
            </div>
            <p class="hint" id="tokenHint">Token 仅用于本次请求，不会写入日志。</p>
            <label class="check-line"><input type="checkbox" id="rememberToken" checked><span>在本机浏览器记住 Token</span></label>

            <label class="field-label" for="ratioSelect">幻灯片比例</label>
            <div class="ratio-group" id="ratioGroup">
              <button class="ratio-opt active" type="button" data-ratio="16:9"><strong>16 : 9</strong><span>宽屏演示</span></button>
              <button class="ratio-opt" type="button" data-ratio="4:3"><strong>4 : 3</strong><span>经典版式</span></button>
            </div>

            <div class="switch-list">
              <label class="switch-line">
                <span><strong>移除水印</strong><small>过滤重复短文本与角标水印</small></span>
                <input type="checkbox" id="removeWatermark" checked><i class="switch"></i>
              </label>
              <label class="switch-line">
                <span><strong>启用解析缓存</strong><small>重复转换同一 PDF 可跳过 API 调用</small></span>
                <input type="checkbox" id="useCache"><i class="switch"></i>
              </label>
            </div>
          </section>

        </div>

        <div class="panel-footer">
          <section class="progress-area" id="progressArea" hidden>
            <div class="progress-head"><span id="progressStage">准备中</span><strong id="progressPct">0%</strong></div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <p class="progress-note" id="progressNote">MinerU 为大文件逐页解析，通常需要几分钟，请勿关闭页面。</p>
          </section>

          <div class="actions">
            <button class="btn-primary" id="convertBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6"/>
              </svg>
              <span>开始转换</span>
            </button>
            <button class="btn-ghost" id="demoBtn" type="button">加载示例（免 Token）</button>
          </div>
        </div>
      </aside>

      <!-- 右侧预览 -->
      <section class="viewer">
        <div class="viewer-toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active" id="tabPptx" type="button" role="tab" aria-selected="true">PPTX 预览</button>
            <button class="tab" id="tabPdf" type="button" role="tab" aria-selected="false">PDF 原稿</button>
          </div>
          <div class="viewer-tools">
            <div class="pager">
              <button class="icon-btn small" id="prevPage" type="button" aria-label="上一页" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span id="pageLabel">— / —</span>
              <button class="icon-btn small" id="nextPage" type="button" aria-label="下一页" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
            <span class="toolbar-sep"></span>
            <div class="zoom">
              <button class="icon-btn small" id="zoomOut" type="button" aria-label="缩小">−</button>
              <span id="zoomLabel">适应</span>
              <button class="icon-btn small" id="zoomIn" type="button" aria-label="放大">+</button>
              <button class="icon-btn small" id="zoomFit" type="button" aria-label="适应窗口" title="适应窗口">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
              </button>
            </div>
            <span class="toolbar-sep"></span>
            <button class="btn-download" id="downloadBtn" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
              下载 PPTX
            </button>
          </div>
        </div>

        <div class="stage" id="stage">
          <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 160 120" fill="none" aria-hidden="true">
              <rect x="14" y="18" width="52" height="70" rx="5" class="es-paper"/>
              <path d="M25 36h30M25 46h30M25 56h20M25 66h26" class="es-line"/>
              <path d="M74 53h18M84 45l8 8-8 8" class="es-arrow"/>
              <rect x="98" y="26" width="50" height="56" rx="5" class="es-slide"/>
              <path d="M108 42h30M108 52h22M108 62h26" class="es-line"/>
              <circle cx="123" cy="96" r="3" class="es-dot"/><circle cx="137" cy="96" r="3" class="es-dot"/><circle cx="151" cy="96" r="3" class="es-dot"/>
            </svg>
            <h3>还没有可预览的内容</h3>
            <p>上传 PDF 并点击「开始转换」，或先<strong>加载示例</strong>看看转换效果</p>
            <div class="es-tags"><span>可编辑文本</span><span>原生表格</span><span>高清图片</span></div>
          </div>
          <div class="slide-host" id="slideHost" hidden></div>
          <div class="pdf-sheet" id="pdfSheet" hidden><img id="pdfImage" alt="PDF 原稿页面"></div>
        </div>

        <div class="viewer-footer">
          <span id="viewerInfo">预览区按 PPTX 内的坐标与字号重建，纸张保持白色以便对照实际放映效果</span>
          <span class="viewer-badge" id="viewerBadge">等待任务</span>
        </div>
      </section>
    </main>

    <!-- ============ 日志控制台 ============ -->
    <section class="console" id="console">
      <div class="console-head">
        <div class="console-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5-5-5M11 19h9"/></svg>
          <strong>运行日志</strong>
          <span class="log-count" id="logCount">0 条</span>
        </div>
        <div class="console-actions">
          <button class="mini-btn text" id="clearLog" type="button">清空</button>
          <button class="mini-btn text" id="toggleConsole" type="button">收起</button>
        </div>
      </div>
      <div class="console-body" id="logBody">
        <div class="log-line muted">[系统] 工作台已就绪，等待任务…</div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
